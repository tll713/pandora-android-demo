spring.application.name=server

# Production defaults: demo data is opt-in and transport must use HTTPS.
pandora.demo-data.enabled=${PANDORA_DEMO_DATA_ENABLED:false}
pandora.security.require-https=${PANDORA_REQUIRE_HTTPS:true}
pandora.bootstrap.enabled=${PANDORA_BOOTSTRAP_ENABLED:false}
pandora.bootstrap.phone=${PANDORA_BOOTSTRAP_ADMIN_PHONE:}
pandora.bootstrap.password=${PANDORA_BOOTSTRAP_ADMIN_PASSWORD:}

spring.datasource.url=${PANDORA_DB_URL:jdbc:mysql://localhost:3306/pandora?serverTimezone=Asia/Shanghai}
spring.datasource.username=${PANDORA_DB_USERNAME:pandora_app}
spring.datasource.password=${PANDORA_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

spring.web.resources.static-locations=classpath:/static/,file:../web-admin/

jwt.secret=${PANDORA_JWT_SECRET:}
jwt.expiration=86400000

server.port=8080
server.address=${PANDORA_BIND_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework
