# Explicit local demonstration profile; never enable for a real business database.
pandora.demo-data.enabled=${PANDORA_DEMO_DATA_ENABLED:true}
pandora.security.require-https=${PANDORA_REQUIRE_HTTPS:false}
spring.datasource.url=${PANDORA_DB_URL:jdbc:mysql://localhost:3306/pandora?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
server.address=${PANDORA_BIND_ADDRESS:0.0.0.0}
